[pytest]
testpaths = crawler/tests
python_files = test_*.py
addopts =
    --strict-markers
    --ignore=crawler/tests/test_resume_split.py
    --cov-branch
    --cov=crawler.utils.collection_pipeline
    --cov=crawler.utils.encoding_quality
    --cov=crawler.utils.job_schema
    --cov=crawler.utils.time_utils
    --cov-fail-under=60
    --cov-report=term-missing
    --cov-report=html:output/evidence/python-coverage
    --cov-report=xml:output/evidence/python-coverage.xml
    --cov-report=json:output/evidence/python-coverage.json
