name: Weekly official course catalog
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python crawler/spiders/education/official_course_spider.py --limit 700 --workers 8
      - run: python crawler/scripts/validate_course_v2.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh verified official courses"
          file_pattern: "crawler/data/education/course_data.csv crawler/data/report/course_v2_quality_report.json crawler/data/raw/education/course_api/**"
