services:
  postgres:
    image: postgres:18
    container_name: talentgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-talentgraph_dev}
      POSTGRES_USER: ${PGUSER:-talentgraph}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env.data}
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - talentgraph_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  import-gold:
    build:
      context: .
      dockerfile: database/Dockerfile.importer
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-talentgraph_dev}
      PGUSER: ${PGUSER:-talentgraph}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env.data}
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - talentgraph_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  talentgraph_pgdata:
  talentgraph_qdrant_data:
