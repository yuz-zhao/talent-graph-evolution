services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-talentgraph_dev}
      POSTGRES_USER: ${PGUSER:-talentgraph}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env.docker}
    ports:
      - "${PGPORT_HOST:-5433}:5432"
    volumes:
      - talentgraph_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  import-gold:
    build:
      context: .
      dockerfile: database/Dockerfile.importer
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-talentgraph_dev}
      PGUSER: ${PGUSER:-talentgraph}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env.docker}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  neo4j:
    image: neo4j:latest
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.docker}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - talentgraph_neo4j_data:/data
      - ./knowledge_graph/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p '${NEO4J_PASSWORD}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30

  import-neo4j:
    image: neo4j:latest
    environment:
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.docker}
    volumes:
      - ./knowledge_graph/import:/import:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["cypher-shell -a bolt://neo4j:7687 -u $$NEO4J_USER -p $$NEO4J_PASSWORD -f /import/import_current_graph.cypher && cypher-shell -a bolt://neo4j:7687 -u $$NEO4J_USER -p $$NEO4J_PASSWORD -f /import/refresh_encoding_affected_subgraph.cypher"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - talentgraph_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3001
      TESSERACT_PATH: /usr/bin/tesseract
      PDFTOPPM_PATH: /usr/bin/pdftoppm
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-talentgraph_dev}
      PGUSER: ${PGUSER:-talentgraph}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env.docker}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.docker}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-talentgraph_evidence_v2}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.docker}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      EMBEDDING_URL: ${EMBEDDING_URL:-}
    ports:
      - "${API_PORT_HOST:-3001}:3001"
    volumes:
      - talentgraph_uploads:/app/uploads
    depends_on:
      import-gold:
        condition: service_completed_successfully
      import-neo4j:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  talentgraph_pgdata:
  talentgraph_neo4j_data:
  talentgraph_qdrant_data:
  talentgraph_uploads:
